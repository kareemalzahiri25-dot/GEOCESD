<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="75%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Sunrise Glow -->
    <radialGradient id="sunGlow" cx="72%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#fed7aa" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#fdba74" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>

    <!-- Distant Mountain Range Gradient -->
    <linearGradient id="distantMtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Mount Sindoro / Prau Main Peak Gradient (Lit side) -->
    <linearGradient id="sindoroLit" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mount Sindoro Shadow Side -->
    <linearGradient id="sindoroShade" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Volcanic Green Slopes -->
    <linearGradient id="hillGreen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="hillGreen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="hillGreenForeground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Morning Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95" />
    </linearGradient>

    <!-- Geothermal Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="blurMist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>

    <filter id="blurSteam" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Morning Sunrise Glow -->
  <rect width="1920" height="1080" fill="url(#sunGlow)" />

  <!-- Distant Background Mountain Ridges (Gunung Sumbing / Prau Range) -->
  <path d="M0 640 L180 570 L380 610 L620 520 L840 580 L1100 480 L1320 540 L1580 470 L1760 520 L1920 490 L1920 1080 L0 1080 Z" fill="url(#distantMtnGrad)" opacity="0.65" />

  <!-- Mount Sindoro Majestic Volcano (Iconic Central Java Peak in Dieng Plateau) -->
  <!-- Left/West Slope (In Shadow) -->
  <path d="M1120 220 Q1220 310 1380 460 Q1520 600 1780 780 L880 780 Q1010 520 1100 330 Z" fill="url(#sindoroShade)" />
  
  <!-- Right/East Slope (Lit by Morning Sun) -->
  <path d="M1120 220 Q1190 280 1280 380 Q1380 490 1520 620 Q1680 740 1860 820 L1120 780 Z" fill="url(#sindoroLit)" opacity="0.9" />

  <!-- Volcanic Ridges & Erosion Gullies -->
  <path d="M1120 220 Q1145 285 1165 370 Q1195 490 1230 620 Q1270 730 1310 800" stroke="#1e293b" stroke-width="6" fill="none" opacity="0.4" />
  <path d="M1120 220 Q1100 300 1070 410 Q1030 540 980 690" stroke="#0f172a" stroke-width="5" fill="none" opacity="0.5" />
  <path d="M1150 260 Q1175 340 1210 440 Q1260 570 1320 710" stroke="#334155" stroke-width="4" fill="none" opacity="0.35" />
  <path d="M1100 290 Q1065 390 1020 510 Q970 640 920 740" stroke="#0f172a" stroke-width="5" fill="none" opacity="0.4" />
  <path d="M1130 330 Q1155 420 1180 520 Q1210 650 1240 760" stroke="#475569" stroke-width="3" fill="none" opacity="0.4" />

  <!-- Caldera Crater Saddle at the Peak -->
  <ellipse cx="1120" cy="225" rx="28" ry="8" fill="#1e293b" />
  <ellipse cx="1120" cy="223" rx="20" ry="5" fill="#334155" opacity="0.7" />

  <!-- Midground Rolling Volcanic Highlands (Dieng Plateau Hills) -->
  <path d="M520 820 Q740 620 1020 670 Q1320 720 1620 590 Q1780 520 1920 560 L1920 1080 L520 1080 Z" fill="url(#hillGreen1)" opacity="0.9" />

  <!-- Terraced Rolling Tea & Agricultural Slopes of Dieng -->
  <path d="M0 720 Q220 610 490 660 Q760 710 1040 600 Q1320 490 1680 620 L1920 700 L1920 1080 L0 1080 Z" fill="url(#hillGreen2)" opacity="0.85" />

  <!-- Geothermal Steam Plumes rising from Dieng Plateau Power Field -->
  <!-- Steam Plume 1 (Main Geothermal Well) -->
  <path d="M1380 680 Q1360 560 1390 440 Q1420 340 1380 260 Q1340 210 1360 160" stroke="url(#steamGrad)" stroke-width="55" stroke-linecap="round" fill="none" filter="url(#blurSteam)" opacity="0.85" />
  <path d="M1380 680 Q1395 570 1375 460 Q1355 360 1390 280 Q1410 230 1395 180" stroke="url(#steamGrad)" stroke-width="35" stroke-linecap="round" fill="none" filter="url(#blurSteam)" opacity="0.9" />

  <!-- Steam Plume 2 (Secondary Fumarole) -->
  <path d="M1520 650 Q1545 560 1515 480 Q1490 400 1525 320" stroke="url(#steamGrad)" stroke-width="30" stroke-linecap="round" fill="none" filter="url(#blurSteam)" opacity="0.7" />

  <!-- Steam Plume 3 (Distant Geothermal Station) -->
  <path d="M960 670 Q940 590 965 520 Q985 450 970 380" stroke="url(#steamGrad)" stroke-width="25" stroke-linecap="round" fill="none" filter="url(#blurSteam)" opacity="0.6" />

  <!-- Foreground Green Caldera Ridge -->
  <path d="M-50 860 Q280 760 640 820 Q1060 880 1480 760 Q1740 690 1980 750 L1980 1080 L-50 1080 Z" fill="url(#hillGreenForeground)" />

  <!-- Valley Floor Atmospheric Mist Layer (Morning Clouds) -->
  <rect x="0" y="550" width="1920" height="530" fill="url(#mistGrad)" />
  <ellipse cx="980" cy="740" rx="900" ry="120" fill="#ffffff" filter="url(#blurMist)" opacity="0.45" />
  <ellipse cx="1400" cy="790" rx="700" ry="100" fill="#ffffff" filter="url(#blurMist)" opacity="0.5" />
</svg>
