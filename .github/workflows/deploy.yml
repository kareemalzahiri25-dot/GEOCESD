name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Create SPA 404 fallback copy
        run: cp dist/index.html dist/404.html

      - name: Publish dist to gh-pages branch (for "Deploy from a branch" mode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload Pages artifact (for "GitHub Actions" mode)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        continue-on-error: true
